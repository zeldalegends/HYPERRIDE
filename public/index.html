<script>
    document.getElementById('popupButton').addEventListener('click', function() {
        alert("\nUpload files\n" +
              "curl -T <src-path> " + location + "upload/<file-name> -H 'Content-Type:application/octet-stream'\n" +
              "\nDelete files\n" +
              "curl -X DELETE " + location + "upload/<file-name>\n" +
              "curl " + location + "delete/<file-name>");
    });
