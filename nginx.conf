# docker run --rm nginx cat /etc/nginx/conf.d/default.conf

upstream node_red {
    server node-red:1880;
}

server {
    listen        80;
    listen        [::]:80;
    server_name   localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # Enable CORS
    add_header  'Access-Control-Allow-Origin'    "*";
    add_header  'Access-Control-Allow-Methods'   "GET, POST, PUT, DELETE, OPTIONS";
    add_header  'Access-Control-Allow-Headers'   "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With";
    add_header  'Access-Control-Expose-Headers'  "Authorization";
    add_header  'X-Frame-Options'                "DENY";
    add_header  'X-Content-Type-Options'         "nosniff";
    add_header  'Content-Security-Policy'        "default-src 'self'";

    # Path without authentication: /orion/version
    location /orion/version {
        proxy_pass          http://orion:1026/version;
    }

    # Path without authentication: /orion/ngsi-ld/ex/v1/version
    location /orion/ngsi-ld/ex/v1/version {
        proxy_pass          http://orion:1026/ngsi-ld/ex/v1/version;
    }

    # Proxy Orion protected with Keycloak authentication
    location /orion/ {
        proxy_pass          http://orion:1026/;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;

        # JWT token verification with Keycloak
        auth_request        /auth;
    }

    # Endpoint for token verification with Keycloak
    location = /auth {
        internal;
        proxy_pass          http://keycloak:8080/realms/dedalus/protocol/openid-connect/userinfo;
        proxy_set_header    Authorization      $http_authorization;
    }

    # Proxy Node-RED
    location ~* /(api|dashboard|editor|ui|worldmap) {
        proxy_pass          http://node-red:1880;

	# If using a different location, e.g. `/red/`, we need to rewrite all of the /red/ URLS to remove the `red` part
	# rewrite ^/red/(.*)$ /$1 break;

	# If you only want to expose the Node-RED Dashboard instead of the whole of Node-RED 
	# rewrite ^/(.*)$ /ui/$1 break;

        # Disable buffer
        proxy_buffering     off;

	# Defines the HTTP protocol version for proxying (by default it is set to 1.0).
	# For Websockets and keepalive connections you need to use the version 1.1    
	proxy_http_version  1.1;

	# These header fields are required if your application is using Websockets
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";

	# Sets conditions under which the response will not be taken from a cache.
	# proxy_cache_bypass  $http_upgrade;

	# The $host variable in the following order of precedence contains:
	# hostname from the request line, or hostname from the Host request header field, or the server name matching a request.    
	# proxy_set_header Host $host;

	# Forwards the real visitor remote IP address to the proxied server
	# proxy_set_header X-Real-IP $remote_addr;

	# A list containing the IP addresses of every server the client has been proxied through    
	# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

	# When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.    
	# proxy_set_header X-Forwarded-Proto $scheme;

	# Defines the original host requested by the client.    
	# proxy_set_header X-Forwarded-Host $host;

	# Defines the original port requested by the client.    
	# proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy Keycloak
    location /keycloak/auth/ {
        proxy_pass          http://keycloak:8080/keycloak/auth/;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Host   $host;
        proxy_set_header    X-Forwarded-Server $host;
        proxy_set_header    X-Forwarded-Port   $server_port;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    location /keycloak/ {
        proxy_pass          http://keycloak:8080/;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Host   $host;
        proxy_set_header    X-Forwarded-Server $host;
        proxy_set_header    X-Forwarded-Port   $server_port;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # Proxy Mongo-Express
    location /mongoadmin {
        proxy_pass          http://mongo-express:8081;
        proxy_set_header    Host               $host;
	proxy_set_header    X-Real_IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    }

    location ^~ /smartdatamodels/ {
        proxy_pass          https://smartdatamodels.org:1026/;
    }

    ## Blockchain
    #location ^~ /ganache/ {
    #    proxy_pass          http://ganache:7545/;
    #
    #    # Enable WebSockets
    #    proxy_http_version  1.1;
    #    proxy_set_header    Upgrade            $http_upgrade;
    #    proxy_set_header    Connection         "upgrade";
    #
    #    proxy_set_header    X-Real-IP          $remote_addr;
    #    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    #    proxy_set_header    Host               $http_host;
    #    proxy_set_header    X-NginX-Proxy      true;
    #}

    # Nginx web server
    location / {
        root   /home/www/public_html/localhost/public;
        index  index.html index.htm;
        try_files $uri $uri/ index.html =404;
        autoindex on;
    }

    # Test URL proxy
    location /example/ {
        proxy_pass  http://example.org/;
    }

    # Test API proxy
    location /ip {
        proxy_pass  http://ifconfig.me;
        rewrite ^/ip/(.*)$ /$1 break;
    }

    # Test default web server
    location /default/ {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 401 = @error401;
    location @error401 {
        return 401 '"Unauthorized"';
        add_header Content-Type application/json;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
