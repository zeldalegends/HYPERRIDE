services:

  # The Context Broker (Orion-LD)
  orion-ld:
    image: quay.io/fiware/orion-ld:1.7.1 # fiware/orion-ld:1.7.1
    hostname: orion
    container_name: orion-ld
  # depends_on:
  #   mongo:
  #     condition: service_healthy
    depends_on:
      - mongo
  # restart: on-failure # for Docker Compose
  # deploy:             # for Docker Swarm
  #   restart_policy:
  #     condition: on-failure
  # networks:
  #   - default
  # networks:
  #   default:
  #     aliases:
  #       - context-broker
  #       - ...
    expose:
      - "1026"      # orion-ld:1026
  # ports:
  #   - "1026:1026" # localhost:1026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OAUTH2_ENABLED=true
      - OAUTH2_TOKEN_ENDPOINT=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      - OAUTH2_CLIENT_ID=${ORION_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${ORION_CLIENT_SECRET}
    command: -dbhost mongo-db -db orionld -logLevel DEBUG -forwarding # -mongocOnly # avoids Legacy C++ driver (deprecated) but disable NGSI-v2 support
    healthcheck:
    # test: curl --fail -s http://localhost:1026/version || exit 1
      test: curl -sfL http://host.docker.internal/orion/version || exit 1

  # DB for the Context Broker (MongoDB)
  mongo:
    image: mongo:5.0 #:5.0.30 #:6.0.19 #:8.0.4
    hostname: mongo-db
    container_name: db-mongo
  # restart: always
    expose:
      - "27017"       # mongo:27017
  # ports:
  #   - "27017:27017" # localhost:27017
    command: --nojournal # for mongo < 6.0
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-configdb:/data/configdb
      - mongo-db:/data/db
    healthcheck:
    # test: test $$(echo "db.runCommand('ping').ok" | mongosh --quiet) -eq 1
    # test: mongosh --eval "db.runCommand('ping')"
      test: mongosh localhost:27017/test --quiet

  # Identity Manager (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak #:23.0.6 #:26.0.7
    hostname: idm
    container_name: keycloak
  # restart: always
    expose:
      - "8080"      # keycloak:8080
      - "9000"      # keycloak:9000
    ports:
      - "8080:8080" # localhost:8080
      - "9000:9000" # localhost:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
    # - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
    # - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./configs/realm-config.json:/opt/keycloak/data/import/realm-config.json
      - keycloak-data:/opt/keycloak/data/
    healthcheck:
    # test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;"
      test: "exec 3<>/dev/tcp/host.docker.internal/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"

  # Reverse proxy (Nginx)
  nginx:
    image: nginx #:1.27.3
    hostname: context
    container_name: nginx
    depends_on:
      - keycloak
      - orion-ld
      - node-red
  # restart: always
    expose:
      - "80"    # nginx:80
    ports:
      - "80:80" # localhost:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/home/www/public_html/localhost/public
    healthcheck:
    # test: curl -sf http://localhost/data-models/ngsi-context.jsonld
    # test: curl -sf --head http://context/data-models/context.jsonld | awk 'NR==1{print $2}' | grep -q -e "200"
    # test: curl -sf --head http://context/data-models/context.jsonld | awk '/^HTTP/{print $2}' | grep -q -e "200"
      test: curl -sfL http://host.docker.internal/data-models/context.jsonld -o /dev/null -w %{http_code} | grep -q -e "200"

  ##################
  # OTHER SERVICES #
  ##################

  # Context Provider, Custom IoT Agent, Demo Webapp and Swagger (Node-RED)
  node-red:
  # build: node-red
    image: nodered/node-red #:4.0.8
    hostname: ${HOSTNAME:-node-red}
    container_name: node-red
    depends_on:
      - ganache
      - keycloak
      - mosquitto
      - orion-ld
  # restart: always
  # networks:
  #   - dedalus-net
    expose:
      - "1880"               # node-red:1880
    ports:
      - "${PORT:-1880}:1880" # localhost:${PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Amsterdam
    user: root
    entrypoint: bash -c "cd /data; npm i --unsafe-perm --no-update-notifier --no-fund --only=production; cd /usr/src/node-red; ./entrypoint.sh"
    volumes:
      - ./node-red/data:/data
      - .:/home/node-red

  # Blockchain with deployed PoE smart contract (Ganache)
  ganache:
  # image: trufflesuite/ganache #:v7.9.2
    image: hybuild/ganache:poe9 #:etk4
    hostname: ethereum
    container_name: ganache
  # restart: always
  # networks:
  #   - dedalus-net
    expose:
      - "1880"      # ganache:7545
    ports:
      - "7545:7545" # localhost:7545
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # command: --database.dbPath /db --server.host 0.0.0.0 --server.port 7545 --wallet.mnemonic "visit carpet logic blame furnace confirm rebel deliver medal mean illness error"
    volumes:
      - ganache-db:/db
    healthcheck:
      test: node -e "fetch('http://host.docker.internal:7545', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ id:1, jsonrpc:'2.0', method:'eth_blockNumber' }) }).then(res => res.json()).then(res => process.exit(0)).catch(err => process.exit(1));"

  # MQTT Broker (MosQuiTTo)
  mosquitto:
    image: eclipse-mosquitto #:2.0.20
    hostname: mqtt
    container_name: mosquitto
  # restart: always
  # networks:
  #   - dedalus-net
    expose:
      - "1883"      # mosquitto:1883
      - "9001"      # mosquitto:9001
    ports:
      - "1883:1883" # localhost:1883
      - "9001:9001" # localhost:9001
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error

  # docker exec -it mosquitto mosquitto_sub -h mosquitto -t "/#"
  # docker exec -it mosquitto mosquitto_pub -h mosquitto -m "Hello world!" -t "/test"

  # Mongo DB front-end (Mongo Express)
  mongo-express:
    image: mongo-express #:1.0.2-18
    hostname: mongo-admin
    container_name: mongo-express
    depends_on:
      - mongo
  # restart: always
  # networks:
  #   - dedalus-net
    expose:
      - "8081"      # mongo-express:8081
  # ports:
  #   - "8081:8081" # localhost:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
    # - ME_CONFIG_BASICAUTH=true
    # - ME_CONFIG_BASICAUTH_USERNAME=admin
    # - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_BASICAUTH_USERNAME=alerox
      - ME_CONFIG_BASICAUTH_PASSWORD=1234567890
      - ME_CONFIG_MONGODB_SERVER=mongo-db
      - ME_CONFIG_SITE_BASEURL=/mongoadmin
      - ME_CONFIG_HEALTH_CHECK_PATH=/status
    healthcheck:
    # test: wget --quiet --tries=3 --spider http://admin:pass@127.0.0.1:8081/mongoadmin/status
      test: wget --quiet --tries=3 --spider http://alerox:1234567890@host.docker.internal/mongoadmin/status

  # docker run -it --rm --net=dedalus-net --name mongo-express -e ME_CONFIG_BASICAUTH=false -e ME_CONFIG_MONGODB_SERVER=mongo-db mongo-express
  # docker run -it --rm --net=dedalus-net --name ngrok -e NGROK_AUTHTOKEN=2e3OcV139oYcSUIwi0bCL4NLexU_554rNagEXCygsfFeNm7aA ngrok/ngrok:latest http 8081

volumes:
  blockchain-db: ~
  ganache-db: ~
  keycloak-data: ~
  mongo-configdb: ~
  mongo-db: ~
  mosquitto-data: ~
  mosquitto-log: ~

