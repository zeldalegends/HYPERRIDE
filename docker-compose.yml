# version: "3.8"

services:

  # The Context Broker (Orion-LD)
  orion-ld:
    platform: linux/amd64
  # image: fiware/orion-ld:1.7.1
    image: quay.io/fiware/orion-ld:1.7.1
    hostname: orion
    container_name: orion-ld
  # depends_on:
  #   mongo:
  #     condition: service_healthy
    depends_on:
      - mongo
  # restart: on-failure # for Docker Compose
  # deploy:             # for Docker Swarm
  #   restart_policy:
  #     condition: on-failure
    networks:
      - hyperride-net
  # expose:
  #   - "1026"
  # ports:
  #   - "1026:1026"
    environment:
      - OAUTH2_ENABLED=true
      - OAUTH2_TOKEN_ENDPOINT=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      - OAUTH2_CLIENT_ID=${ORION_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${ORION_CLIENT_SECRET}
    command: -dbhost mongo-db -db orionld -logLevel DEBUG -forwarding -mongocOnly
    healthcheck:
      test: curl -sf http://localhost:1026/version || exit 1

  # DB for the Context Broker (MongoDB)
  mongo:
    image: mongo:6 #:6.0.19 (6.0) :8.0.4 (latest)
    hostname: mongo-db
    container_name: db-mongo
  # restart: always
    networks:
      - hyperride-net
  # command: --nojournal
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-configdb:/data/configdb
      - mongo-db:/data/db
    healthcheck:
      test: mongosh localhost:27017/test --quiet || exit 1
    # test: mongo --eval "db.adminCommand('ping')" --quiet"
    # test: echo 'db.stats().ok' | mongo localhost:27017/test --quiet
    # test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet

  # Context Provider and Swagger GUI (Node.js)
  node-red:
  # build: node-red
    image: nodered/node-red #:4.0.8
    hostname: ${HOSTNAME:-node-red}
    container_name: node-red
  # depends_on:
  #   ganache:
  #     condition: service_healthy
  #   keycloak:
  #     condition: service_healthy
  #   mosquitto:
  #     condition: service_healthy
  # depends_on:
  #   - ganache
  #   - keycloak
  #   - mosquitto
  # restart: always
    networks:
      - hyperride-net
    ports:
      - "${PORT:-1880}:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Amsterdam
    user: root
    entrypoint: bash -c "cd /data; npm i --unsafe-perm --no-update-notifier --no-fund --only=production; cd /usr/src/node-red; ./entrypoint.sh"
    volumes:
      - ./node-red/data:/data
      - .:/home/node-red

  # Identity Manager (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6 #:26.0.7
    hostname: idm
    container_name: keycloak
  # restart: always
    networks:
      - hyperride-net
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    volumes:
      - ./configs/realm-config.json:/opt/keycloak/data/import/realm-config.json
      - keycloak-data:/opt/keycloak/data/
  # healthcheck:
  #   test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"

  # Reverse proxy and Web Server for NGSI-LD @context files (Nginx)
  nginx:
    image: nginx #:1.27.3
    hostname: web
    container_name: nginx
  # depends_on:
  #   keycloak:
  #     condition: service_healthy
  #   orion-ld:
  #     condition: service_healthy
  #   node-red:
  #     condition: service_healthy
    depends_on:
      - keycloak
      - orion-ld
      - node-red
  # restart: always
    networks:
      hyperride-net:
        aliases:
          - context
          - ld-context
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/home/www/public_html/localhost/public
    # - ./public:/usr/share/nginx/html
    healthcheck:
      test: curl -sf http://localhost/data-models/ngsi-context.jsonld
    # test: (wget --server-response --spider --quiet  http://context/data-models/ngsi-context.jsonld 2>&1 | awk 'NR==1{print $$2}'|  grep -q -e \"200\") || exit 1

  # Blockchain with deployed PoE smart contract
  ganache:
  # image: trufflesuite/ganache #:v7.9.2
    image: hybuild/ganache #:poe9 #:etk4
    hostname: rpc
    container_name: ganache
  # restart: always
    networks:
      - hyperride-net
    ports:
      - "7545:7545"
  # command: --database.dbPath /db --server.host 0.0.0.0 --server.port 7545 --wallet.mnemonic "visit carpet logic blame furnace confirm rebel deliver medal mean illness error"
    volumes:
      - ganache-db:/db
    healthcheck:
      test: node -e "fetch('http://localhost:7545', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ id:1, jsonrpc:'2.0', method:'eth_blockNumber' }) }).then(res => res.json()).then(res => process.exit(0)).catch(err => process.exit(1));"

  # MQTT Broker (MosQuiTTo)
  mosquitto:
    image: eclipse-mosquitto #:2.0.20
    hostname: mqtt
    container_name: mosquitto
  # restart: always
    networks:
      - hyperride-net
    ports:
      - "1883:1883"
    # - "9001:9001"
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error

  # docker exec -it mosquitto mosquitto_sub -h mosquitto -t "/#"
  # docker exec -it mosquitto mosquitto_pub -h mosquitto -m "Hello world!" -t "/test"

  # Mongo DB front-end
  mongo-express:
    image: mongo-express #:1.0.2-18
    hostname: mongo-fe
    container_name: fe-mongo
  # depends_on:
  #   mongo:
  #     condition: service_healthy
    depends_on:
      - mongo
  # restart: always
    networks:
      - hyperride-net
  # expose:
  #   - "8081"
  # ports:
  #   - "8081:8081"
    environment:
  #   - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_BASICAUTH_USERNAME=
      - ME_CONFIG_BASICAUTH_PASSWORD=
      - ME_CONFIG_MONGODB_SERVER=mongo-db
      - ME_CONFIG_SITE_BASEURL=/mongoadmin
      - ME_CONFIG_HEALTH_CHECK_PATH=/status
    healthcheck:
      test: wget --quiet --tries=3 --spider http://admin:pass@mongo-fe:8081/status || exit 1

  # docker run -it --rm --net=hyperride-net --name fe-mongo -e ME_CONFIG_BASICAUTH=true -e ME_CONFIG_MONGODB_SERVER=mongo-db mongo-express
  # docker run -it --rm --net=hyperride-net --name ngrok-mongo -e NGROK_AUTHTOKEN=2e3OcV139oYcSUIwi0bCL4NLexU_554rNagEXCygsfFeNm7aA ngrok/ngrok:latest http 8081

volumes:
  ganache-db: ~
  keycloak-data: ~
  mongo-configdb: ~
  mongo-db: ~
  mosquitto-data: ~
  mosquitto-log: ~

networks:
  hyperride-net:
    name: hyperride-net
    driver: bridge
